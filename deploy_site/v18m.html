<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>v18 미리보기 (임시)</title>
<style>
  body{margin:0;background:#E9EDF1;font-family:system-ui,sans-serif}
  .row{display:flex;gap:18px;padding:14px;align-items:flex-start}
  .box{background:#fff;border:1px solid #C9D3DB;border-radius:10px;overflow:hidden}
  .box > b{display:block;padding:7px 10px;font-size:12px;background:#10202E;color:#fff}
  iframe{border:0;display:block}
</style>
</head>
<body>
<div class="row">
  <div class="box"><b>1280 · /passes</b><iframe id="d1" src="/passes" width="1280" height="940"></iframe></div>
</div>
<div class="row">
  <div class="box"><b>390 · /passes</b><iframe id="m1" src="/passes" width="390" height="940"></iframe></div>
  <div class="box"><b>390 · /calendar</b><iframe id="m2" src="/calendar" width="390" height="940"></iframe></div>
</div>
<div class="row">
  <div class="box"><b>1280 · /calendar</b><iframe id="d2" src="/calendar" width="1280" height="940"></iframe></div>
</div>
<script>
window.__m = function () {
  var out = {};
  ['d1','m1','m2','d2'].forEach(function (id) {
    var f = document.getElementById(id);
    var d = f.contentDocument;
    if (!d) { out[id] = 'no-access'; return; }
    var nav = d.querySelector('.nav'), btn = d.querySelector('.head-right .btn');
    out[id] = {
      scrollWidth: d.documentElement.scrollWidth,
      clientWidth: d.documentElement.clientWidth,
      navRight: nav ? Math.round(nav.getBoundingClientRect().right) : null,
      btnLeft: btn ? Math.round(btn.getBoundingClientRect().left) : null,
      h1: d.querySelector('h1') ? d.querySelector('h1').textContent.slice(0, 30) : null
    };
  });
  return out;
};
</script>
</body>
</html>
