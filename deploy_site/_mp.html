<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>미리보기 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#DCE3EA}
  body{display:flex;justify-content:flex-start}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="f" scrolling="no" title="미리보기"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  f.style.width = (p.get('w') || 390) + 'px';
  f.style.height = (p.get('h') || 844) + 'px';
  f.src = p.get('p') || '/';
</script>
</body>
</html>
